plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jehia.schedulewidget'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jehia.schedulewidget'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 个人自用：Release 也走调试签名，这样 app-release.apk 能直接装到手机上。
            // 调试签名不能用于对外分发，将来要上架必须换成自己的正式签名。
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
    }
}

// 刻意不引入任何第三方依赖：只用 Android 框架自带的 API，构建最省事。
dependencies {
}
